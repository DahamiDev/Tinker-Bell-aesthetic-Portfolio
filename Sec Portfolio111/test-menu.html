<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Menu Test</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        nav { background: #333; padding: 1rem; }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { color: white; font-size: 1.5rem; }
        .hamburger-menu { display: none; flex-direction: column; cursor: pointer; gap: 4px; padding: 8px; }
        .hamburger-menu span { width: 25px; height: 3px; background: white; transition: all 0.3s; }
        .hamburger-menu.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
        .hamburger-menu.active span:nth-child(2) { opacity: 0; }
        .hamburger-menu.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a { color: white; text-decoration: none; }

        @media (max-width: 479px) {
            .hamburger-menu { display: flex; }
            .nav-links {
                position: fixed;
                top: 100%;
                left: 0;
                width: 100%;
                height: calc(100vh - 100%);
                background: rgba(255, 255, 255, 0.98);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 40px;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 99;
            }
            .nav-links.active { transform: translateX(0); }
            .nav-links a { color: #333; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <div class="logo">Logo</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <div class="hamburger-menu" id="hamburger-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <script>
        const hamburgerMenu = document.getElementById("hamburger-menu");
        const navLinks = document.querySelector(".nav-links");

        hamburgerMenu.addEventListener("click", () => {
            hamburgerMenu.classList.toggle("active");
            navLinks.classList.toggle("active");
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                hamburgerMenu.classList.remove("active");
                navLinks.classList.remove("active");
            });
        });
    </script>
</body>
</html>
